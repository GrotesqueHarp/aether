<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AETHER</title>
<!-- No web fonts. This is a self-hosted app that should work on an LXC with
     no internet, and opening your own dashboard shouldn't send a request to a
     CDN. The stacks below still keep the three distinct voices: a geometric
     display face, a humanist UI face, and a monospace. -->
<style>
:root{
  --bg:#0E1420; --surface:#161E2E; --surface2:#1C2637; --hair:#26324A;
  --text:#DCE3EE; --muted:#8394AD; --dim:#5C6B84;
  --aether:#8B7CF6; --aether-dim:#6455c9; --online:#3FD08A; --warn:#E8B54D; --danger:#F0714A;
  --r:10px;
  --display:'Avenir Next','Segoe UI Variable Display','Futura','Trebuchet MS',
    system-ui,'Helvetica Neue',sans-serif;
  --body:system-ui,-apple-system,'Segoe UI','Inter','Roboto','Helvetica Neue',
    'Noto Sans',sans-serif;
  --mono:ui-monospace,'SF Mono','Cascadia Mono','JetBrains Mono','Menlo',
    'Consolas','DejaVu Sans Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(139,124,246,.10), transparent 60%),
    var(--bg);
  color:var(--text); font-family:var(--body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
.rail{
  border-right:1px solid var(--hair);padding:22px 16px;display:flex;flex-direction:column;gap:6px;
  position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:26px;padding:0 6px}
.brand .logo{width:30px;height:30px}
.brand b{font-family:var(--display);font-size:19px;letter-spacing:.14em;font-weight:700}
.navitem{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r);
  color:var(--muted);font-weight:500;border:1px solid transparent;user-select:none;
}
.navitem:hover{background:var(--surface);color:var(--text)}
.navitem.active{background:var(--surface);color:var(--text);border-color:var(--hair)}
.navitem svg{width:18px;height:18px;flex:none}
.rail .foot{margin-top:auto;font-size:11.5px;line-height:1.7}
.rail .foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--online);margin-right:6px;box-shadow:0 0 8px var(--online)}

.main{padding:26px 34px 60px;max-width:1120px}
.topbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;gap:20px;flex-wrap:wrap}
.topbar .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--aether);text-transform:uppercase}
.topbar h1{font-size:27px;margin-top:3px}
.topbar .net{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}

/* ---- generic bits ---- */
.card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r)}
.grid{display:grid;gap:14px}
.btn{
  background:var(--surface2);border:1px solid var(--hair);color:var(--text);
  padding:9px 15px;border-radius:8px;font-weight:600;font-size:13.5px;transition:.12s;
}
.btn:hover{border-color:var(--aether-dim);background:#212c40}
.btn.primary{background:var(--aether);border-color:var(--aether);color:#0b0f18}
.btn.primary:hover{background:#9c8ff8;filter:brightness(1.03)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chip{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--hair);color:var(--muted);white-space:nowrap}
.attr-Vaccine{color:#7FCBEB} .attr-Data{color:#8FD6B4} .attr-Virus{color:#E86AD0}
.stars{color:var(--warn);letter-spacing:2px;font-size:12px}

/* ---- rift grid ---- */
.rift-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.rift{padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:.14s;position:relative;overflow:hidden}
.rift:hover{border-color:var(--aether-dim);transform:translateY(-2px)}
.rift .sigwrap{display:flex;gap:13px;align-items:center}
.rift .sig{width:56px;height:56px;flex:none;border-radius:10px;background:#0c1220;border:1px solid var(--hair)}
.rift h3{font-size:16px;line-height:1.2}
.rift .host{font-family:var(--mono);font-size:12px;color:var(--muted);word-break:break-all}
.rift .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.rift .biomebar{height:3px;border-radius:2px;margin-top:2px}
.progress-mini{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.progress-mini > i{display:block;height:100%;background:var(--aether)}

/* ---- meters ---- */
.meter{display:grid;grid-template-columns:64px 1fr 34px;align-items:center;gap:9px;font-size:12px}
.meter .track{height:7px;background:#0c1220;border-radius:4px;overflow:hidden}
.meter .track > i{display:block;height:100%;border-radius:4px}

/* ---- daemon card ---- */
.daemon{padding:16px;display:flex;flex-direction:column;gap:13px}
.daemon .head{display:flex;gap:13px;align-items:flex-start}
.daemon .sig{width:60px;height:60px;flex:none;border-radius:10px;background:#0c1220;border:1px solid var(--hair)}
.daemon .title{flex:1;min-width:0}
.daemon .title h3{font-size:17px}
.daemon .lvl{font-family:var(--mono);font-size:11px;color:var(--muted)}
.statline{display:flex;gap:14px;font-family:var(--mono);font-size:12px;flex-wrap:wrap}
.statline b{color:var(--text)}
.xpbar{height:5px;background:#0c1220;border-radius:3px;overflow:hidden}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--aether-dim),var(--aether))}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.actions .btn{padding:7px 11px;font-size:12.5px}

/* ---- battle theatre ---- */
.overlay{position:fixed;inset:0;background:rgba(6,9,15,.78);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.theatre{width:min(680px,96vw);max-height:90vh;overflow:auto}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;padding:18px}
.fighter{text-align:center}
.fighter .sig{width:74px;height:74px;margin:0 auto 8px;border-radius:12px;background:#0c1220;border:1px solid var(--hair)}
.hpbar{height:9px;background:#0c1220;border-radius:5px;overflow:hidden;margin-top:7px}
.hpbar>i{display:block;height:100%;background:var(--online);transition:width .28s}
.hpbar.foe>i{background:var(--danger)}
.vs .versus{font-family:var(--display);color:var(--muted);font-size:13px;letter-spacing:.2em}
.log{font-family:var(--mono);font-size:12.5px;padding:14px 18px;border-top:1px solid var(--hair);max-height:210px;overflow:auto}
.log .row{padding:3px 0;color:var(--muted)}
.log .row .a{color:var(--online)} .log .row .b{color:var(--danger)}
.log .row .crit{color:var(--warn);font-weight:700}
.result{padding:16px 18px;text-align:center;border-top:1px solid var(--hair)}
.result h2{font-size:22px}
.result.win h2{color:var(--online)} .result.lose h2{color:var(--danger)}

/* ---- misc layout ---- */
.section-title{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:26px 0 12px}
.empty{padding:50px 20px;text-align:center;color:var(--muted);border:1px dashed var(--hair);border-radius:var(--r)}
.node-chain{display:flex;gap:0;align-items:stretch;overflow-x:auto;padding-bottom:6px}
.node{min-width:132px;padding:13px;border:1px solid var(--hair);border-radius:10px;margin-right:10px;background:var(--surface);position:relative}
.node.cleared{border-color:var(--online)}
.node.boss{border-color:var(--warn)}
.node.locked{opacity:.5}
.node .n-lvl{font-family:var(--mono);font-size:11px;color:var(--muted)}
.node .n-name{font-weight:600;font-size:13.5px;margin:3px 0}
.picker{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}
.pick{padding:8px 12px;border:1px solid var(--hair);border-radius:9px;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:13px}
.pick:hover,.pick.sel{border-color:var(--aether);background:var(--surface2)}
.pick .dot{width:9px;height:9px;border-radius:50%}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--hair);padding:11px 18px;border-radius:10px;font-size:13.5px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.spin{width:26px;height:26px;border:2px solid var(--hair);border-top-color:var(--aether);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- dormancy ---- */
.rift.dormant{border-color:#3a3358}
.rift.dormant .sig{filter:grayscale(.55) brightness(.7)}
.rift.dormant h3{color:var(--muted)}
.chip.dormant-chip{color:#8B7CF6;border-color:#3a3358}
.chip.online-chip{color:var(--online)}
.pulse-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.pulse-dot.on{background:var(--online);box-shadow:0 0 7px var(--online)}
.pulse-dot.off{background:#4a4370}

/* ---- journal ---- */
.journal{max-width:680px}
.jrow{display:flex;gap:13px;padding:11px 14px;border-left:2px solid var(--hair);margin-bottom:2px;background:var(--surface);border-radius:0 8px 8px 0}
.jrow .jtime{font-family:var(--mono);font-size:10.5px;color:var(--dim);white-space:nowrap;padding-top:2px;min-width:58px}
.jrow .jtext{font-size:13.5px}
.jrow.k-presence_dark{border-left-color:#8B7CF6}
.jrow.k-presence_wake{border-left-color:var(--online)}
.jrow.k-exped_win,.jrow.k-exped_boss,.jrow.k-exped_done,.jrow.k-boss{border-left-color:var(--online)}
.jrow.k-exped_routed,.jrow.k-care_warn{border-left-color:var(--danger)}
.jrow.k-exped_start,.jrow.k-exped_recall{border-left-color:var(--aether)}
.jrow.k-rift_found,.jrow.k-capture,.jrow.k-hatch,.jrow.k-evolve{border-left-color:var(--warn)}

/* ---- expedition badge ---- */
@keyframes flashring{0%{box-shadow:0 0 0 0 rgba(139,124,246,.55)}70%{box-shadow:0 0 0 12px rgba(139,124,246,0)}100%{box-shadow:0 0 0 0 rgba(139,124,246,0)}}
.flash{animation:flashring 1.1s ease-out 2;border-color:var(--aether)!important}
.away.jump{cursor:pointer;transition:.15s}
.away.jump:hover{background:rgba(139,124,246,.14);filter:brightness(1.25)}
.away{font-family:var(--mono);font-size:11px;color:var(--aether);border:1px solid var(--aether-dim);border-radius:999px;padding:2px 9px}
.daemon.is-away{opacity:.75}
.daemon.is-away .actions .btn{pointer-events:none;opacity:.35}
.daemon.is-away .away.jump{pointer-events:auto;opacity:1}

/* ---- resource bar ---- */
.resbar{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:10px 34px;border-bottom:1px solid var(--hair);background:rgba(22,30,46,.6);position:sticky;top:0;z-index:20;backdrop-filter:blur(6px);min-height:22px}
.res{display:flex;align-items:baseline;gap:7px;font-family:var(--mono);font-size:12.5px}
.res .rname{color:var(--dim);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.res .rval{color:var(--text);font-weight:700;transition:.2s}
.res .rval.bump{color:var(--online)}
.res .rrate{color:var(--online);font-size:10.5px}
.res .rdot{width:7px;height:7px;border-radius:50%;align-self:center}

/* ---- harvest UI on nodes ---- */
.node .hv{margin-top:8px;padding-top:8px;border-top:1px dashed var(--hair);font-size:11px}
.node .hv .hv-who{display:flex;align-items:center;gap:6px;font-weight:600;font-size:12px}
.node .hv .hv-rate{font-family:var(--mono);color:var(--online);font-size:10px;margin-top:3px}
.node .hv .hv-life{font-family:var(--mono);color:var(--dim);font-size:10px}
.node .hv button{margin-top:6px;font-size:10.5px;padding:4px 8px}
.node select{width:100%;margin-top:6px;background:#0c1220;color:var(--text);border:1px solid var(--hair);border-radius:6px;padding:5px;font-size:11px}

/* ---- hatchery ---- */
.hatchery{padding:16px}
.egg-row{display:flex;align-items:center;gap:13px;padding:10px 0;border-top:1px solid var(--hair)}
.egg-svg{width:44px;height:44px;flex:none}
.eggbar{height:6px;background:#0c1220;border-radius:3px;overflow:hidden;margin-top:5px}
.eggbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--warn),var(--aether))}
.synth{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.synth .pick{flex-direction:column;align-items:flex-start;gap:3px;min-width:96px}
.synth .pick .cost{font-family:var(--mono);font-size:10px;color:var(--muted)}

.reset-link{margin-top:9px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--dim);cursor:pointer;opacity:.55;transition:.15s}
.reset-link:hover{color:var(--danger);opacity:1}
.rscope{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--hair);border-radius:8px;margin-bottom:7px;cursor:pointer;font-size:12.5px;line-height:1.45}
.rscope:hover{border-color:var(--aether-dim)}
.rscope input{width:auto;margin:3px 0 0}
.reset-modal input{width:100%;background:#0c1220;color:var(--text);border:1px solid var(--hair);border-radius:7px;padding:9px 11px;font-family:var(--mono);font-size:13px;letter-spacing:.1em;margin:4px 0 14px}
.reset-modal input:focus{outline:none;border-color:var(--danger)}

.tank{width:100%;height:300px;display:block;border:1px solid var(--hair);border-radius:12px;
  background:radial-gradient(120% 90% at 50% 0%, rgba(139,124,246,.10), rgba(12,18,32,.85) 70%), #0a0f1c;
  margin-bottom:6px}

@keyframes depthflow{0%{background-position:0 0}100%{background-position:220px 0}}
@keyframes shaftpulse{0%,72%,100%{border-color:var(--hair);background:rgba(22,30,46,.5)}
  80%{border-color:rgba(139,124,246,.45);background:rgba(139,124,246,.07)}}
.layer.done{animation:shaftpulse 5.5s ease-in-out infinite;animation-delay:calc(var(--i,0) * -0.34s)}
canvas.flow{width:100%;height:34px;border-radius:5px;display:block;margin:5px 0 3px}

.cl-dot{width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:7px;display:inline-block}
.clrel.cur{border-color:var(--aether)}
.clhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.clhead h3{font-size:17px}
.clsec{margin-top:9px}
.clsec-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.clsec-h.added{color:var(--online)} .clsec-h.fixed{color:var(--warn)}
.clsec-h.changed{color:var(--aether)} .clsec-h.removed{color:var(--danger)}
.clrel ul{margin:0;padding-left:18px}
.clrel li{font-size:13.5px;line-height:1.55;margin-bottom:4px;color:var(--text)}
.clrel code{font-family:var(--mono);font-size:12px;background:#0c1220;padding:1px 5px;border-radius:4px}

.rec{padding:15px 17px}
.rec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.rec-h h3{font-size:15px}
.rec-h .up{color:var(--online);font-size:12.5px}
.rec-h .down{color:var(--muted);font-size:12.5px}
.spark{width:100%;height:64px;display:block}
.sparkfoot{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:2px}
.rec-note{font-size:11.5px;color:var(--muted);margin-top:6px}
.nodata{font-size:12px;color:var(--dim);padding:18px 0;text-align:center}
.awaygrid{display:flex;flex-direction:column;gap:2px}
.awayrow{display:flex;justify-content:space-between;padding:7px 11px;background:#0c1220;border-radius:7px;font-size:13.5px}
.awayhl{margin-top:13px;border-top:1px solid var(--hair);padding-top:10px}
.awayhl-row{font-size:12.5px;color:var(--muted);padding:3px 0}

.asc-rank{color:var(--warn);font-size:13px;letter-spacing:1px;margin-left:4px}

.gly{padding:13px 15px}
.gly-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.gly-qs{display:flex;flex-direction:column;gap:5px}
.gq{font-size:11.5px;text-align:left;padding:5px 9px}
.gq.poor{opacity:.35}
.gly-own{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.gly-own select{background:#0c1220;color:var(--text);border:1px solid var(--hair);border-radius:6px;padding:5px;font-size:11.5px}
.worn{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.wglyph{font-family:var(--mono);font-size:10px;color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:2px 8px}

.chap{margin-bottom:22px}
.chap-h{display:flex;justify-content:space-between;align-items:baseline}
.chap-h h3{font-size:16px}
.chap-b{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
.obj{display:flex;gap:12px;padding:11px 14px;border:1px solid var(--hair);border-radius:10px;margin-bottom:7px;background:rgba(22,30,46,.4)}
.obj.done{opacity:.5}
.obj.now{border-color:var(--aether);background:rgba(139,124,246,.07)}
.obj-tick{font-size:15px;color:var(--online);width:16px;flex:none}
.obj.now .obj-tick{color:var(--aether)}
.obj-t{font-weight:600;font-size:14px}
.obj-now{font-family:var(--mono);font-size:9.5px;color:var(--aether);border:1px solid var(--aether-dim);border-radius:999px;padding:1px 7px;margin-left:8px}
.obj-w{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:3px}
.obj-h{font-family:var(--mono);font-size:11.5px;color:var(--warn);margin-top:5px}
.nudge{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:9px 14px;border:1px solid var(--aether-dim);border-radius:9px;background:rgba(139,124,246,.07);margin-bottom:14px;cursor:pointer;font-size:13px}
.nudge:hover{background:rgba(139,124,246,.13)}
.nudge .mono{font-size:9.5px;letter-spacing:.14em;color:var(--aether)}
.nudge .muted{font-size:12px}

.gsteps{display:flex;flex-direction:column;gap:8px;max-width:820px}
.gstep{display:flex;gap:13px;padding:12px 15px;border:1px solid var(--hair);border-radius:10px;background:rgba(22,30,46,.45)}
.gstep.done{opacity:.5}
.gstep.next{border-color:var(--aether);background:rgba(139,124,246,.08)}
.gmark{font-size:15px;color:var(--dim);width:16px;flex:none}
.gstep.done .gmark{color:var(--online)}
.gtitle{font-weight:600;font-size:14.5px}
.gnext{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--aether);border:1px solid var(--aether-dim);border-radius:999px;padding:2px 8px;margin-left:9px;text-transform:uppercase}
.gwhy{font-size:13px;color:var(--muted);line-height:1.55;margin-top:3px}
.gwhere{font-size:11px;color:var(--dim);margin-top:5px}
.gtopics{display:flex;flex-direction:column;gap:6px;max-width:820px}
.gtopic{border:1px solid var(--hair);border-radius:9px;background:rgba(22,30,46,.45)}
.gtopic summary{padding:11px 15px;cursor:pointer;font-weight:600;font-size:14px}
.gtopic summary::marker{color:var(--aether)}
.gtopic>div{padding:0 15px 13px;font-size:13px;color:var(--muted);line-height:1.6}

.syn{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--online);border:1px solid var(--online);border-radius:999px;padding:2px 9px;margin:6px 6px 0 0}
.syn.none{color:var(--dim);border-color:var(--hair)}

.trait{font-family:var(--mono);font-size:10px;color:var(--aether);border:1px solid var(--aether-dim);border-radius:999px;padding:2px 8px}
.expbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.expbar select{background:#0c1220;color:var(--text);border:1px solid var(--hair);border-radius:7px;padding:7px 9px;font-size:12.5px}

/* ---- dashboard ---- */
body.dashmode nav.rail, body.dashmode .resbar{display:none}
/* the shell is a 216px rail + content grid; hiding the rail leaves its track
   behind and squeezes the board into a column, so collapse the grid too */
body.dashmode .app{grid-template-columns:1fr}
body.dashmode .main{max-width:none;width:100%}
body.dashmode .main{padding:0}
.dash{padding:30px 40px;min-height:100vh}
.dash-head{display:flex;align-items:baseline;gap:18px;margin-bottom:22px}
.dash-title{font-family:var(--display);font-size:34px;letter-spacing:.22em;color:var(--aether)}
.dash-sub{font-family:var(--mono);font-size:14px;color:var(--muted)}
.dtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.dtile{padding:14px 18px;border:1px solid var(--hair);border-radius:12px;background:rgba(22,30,46,.55)}
.dtile .dlabel{font-family:var(--mono);font-size:11px;letter-spacing:.14em}
.dtile .dval{font-size:34px;font-weight:700;line-height:1.15}
.dtile .drate{font-family:var(--mono);font-size:12px;color:var(--online)}
.dash-tank{height:300px;margin-bottom:20px}
.dash-cols{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-bottom:20px}
.dash-h{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.drift{margin-bottom:11px}
.dr-name{font-size:16px;font-weight:600}
.dr-bar{height:7px;background:#0c1220;border-radius:4px;overflow:hidden;margin:4px 0 3px}
.dr-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--aether-dim),var(--aether))}
.dr-meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.dalert{font-size:15px;padding:7px 12px;border-radius:8px;margin-bottom:7px;border-left:3px solid}
.dalert.good{border-color:var(--online);background:rgba(63,208,138,.07)}
.dalert.warn{border-color:var(--warn);background:rgba(232,200,77,.07)}
.dalert.bad{border-color:var(--danger);background:rgba(240,113,74,.08)}
.dfeed-row{font-size:14px;padding:5px 0;border-top:1px solid var(--hair);color:var(--muted)}
.dfeed-k{font-family:var(--mono);font-size:10.5px;color:var(--aether);letter-spacing:.08em;margin-right:10px;text-transform:uppercase}
.dash-foot{margin-top:22px;font-family:var(--mono);font-size:11px;color:var(--dim);opacity:.6}

.mastery{max-width:720px;margin:0 0 14px;padding:11px 14px;border:1px solid var(--hair);border-radius:10px;background:rgba(22,30,46,.45)}
.mast-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.mast-lvl{font-family:var(--display);font-size:14px;letter-spacing:.1em;color:var(--warn)}
.mast-bar{height:6px;background:#0c1220;border-radius:3px;overflow:hidden}
.mast-bar>i{display:block;height:100%;background:linear-gradient(90deg,#8a6a2a,var(--warn))}
.mast-ms{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ms{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;padding:2px 8px;border-radius:999px;border:1px solid var(--hair);color:var(--dim)}
.ms.have{color:var(--warn);border-color:var(--warn)}

.descent-split{display:flex;gap:20px;align-items:flex-start;max-width:900px}
.xsec{width:132px;height:560px;flex:none;position:sticky;top:14px}
.xs-worker circle:first-child{animation:xsPulse 3.2s ease-in-out infinite}
@keyframes xsPulse{0%,100%{opacity:.95}50%{opacity:.55}}
.descent-split .shaft{flex:1;min-width:0}
@media (max-width:900px){.xsec{display:none}}

/* ---- the shaft ---- */
.depthbar{position:relative;height:10px;background:#0c1220;border:1px solid var(--hair);border-radius:6px;margin:4px 0 8px;overflow:visible}
.depthbar>i{display:block;height:100%;border-radius:5px;
  background:linear-gradient(90deg,var(--aether-dim),var(--aether),rgba(255,255,255,.55),var(--aether),var(--aether-dim));
  background-size:220px 100%;animation:depthflow 3.4s linear infinite}
.depthbar .tick{position:absolute;top:-3px;width:2px;height:16px;background:#2b3448;transform:translateX(-1px)}
.depthbar .tick.gk{height:20px;top:-5px;background:#4a3a2a}
.depthbar .tick.hit{background:var(--warn)}
.depthline{font-size:12px;color:var(--muted);margin-bottom:14px}
.shaft{display:flex;flex-direction:column;gap:6px;max-width:720px}
.layer{display:flex;align-items:center;gap:14px;padding:10px 14px;border:1px solid var(--hair);border-radius:9px;background:rgba(22,30,46,.5)}
.layer .lnum{font-family:var(--mono);font-size:13px;color:var(--dim);min-width:38px}
.layer .lbody{flex:1}
.layer .lhead{font-size:13px;font-weight:600}
.layer .ltags{margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.ltag{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;padding:2px 7px;border-radius:999px;border:1px solid var(--hair);color:var(--muted)}
.ltag.gk{color:var(--warn);border-color:var(--warn)}
.ltag.cap{color:var(--aether);border-color:var(--aether-dim)}
.ltag.dim{opacity:.5}
.layer.done{opacity:.55}
.layer.front{border-color:var(--aether);background:rgba(139,124,246,.09)}
.layer.locked{opacity:.4}
.shelves{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;max-width:820px}
.shelf{padding:11px 13px;border:1px solid var(--hair);border-radius:9px;background:rgba(22,30,46,.5);font-size:11.5px}
.shelf .slabel{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.08em;margin-bottom:6px}
.shelf select{width:100%;margin-top:5px;background:#0c1220;color:var(--text);border:1px solid var(--hair);border-radius:6px;padding:5px;font-size:11px}

/* ---- bastion ---- */
.fac{padding:15px;display:flex;flex-direction:column;gap:9px}
.fac .fhead{display:flex;justify-content:space-between;align-items:baseline}
.fac h3{font-size:15.5px}
.fac .flevel{font-family:var(--mono);font-size:11px;color:var(--aether)}
.fac .fdesc{font-size:12.5px;color:var(--muted)}
.fac .feffect{font-family:var(--mono);font-size:11.5px;color:var(--online)}
.fac .fcost{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.fac.unbuilt{opacity:.8;border-style:dashed}
.fac .occ{display:flex;align-items:center;gap:7px;font-size:12px;padding:6px 9px;background:#0c1220;border-radius:7px}
.fac .occ .mono{font-size:10px;color:var(--online)}
.fac select{background:#0c1220;color:var(--text);border:1px solid var(--hair);border-radius:6px;padding:6px;font-size:11.5px}

/* ---- incursion ---- */
@keyframes throb{0%,100%{box-shadow:0 0 0 0 rgba(240,113,74,.35)}50%{box-shadow:0 0 0 6px rgba(240,113,74,0)}}
.inc-badge{font-family:var(--mono);font-size:10.5px;color:var(--danger);border:1px solid var(--danger);border-radius:999px;padding:2px 9px;animation:throb 2s infinite}
.inc-panel{border-color:var(--danger)!important;padding:15px}
.inc-panel h3{color:var(--danger)}
.inc-count{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--danger)}
.null-chip{font-family:var(--mono);font-size:11px;color:#8B7CF6;border:1px solid #3a3358;border-radius:7px;padding:4px 9px}

/* ---- party picker & team battles ---- */
.pick.in-party{border-color:var(--online);background:rgba(63,208,138,.08)}
.pick .pnum{font-family:var(--mono);font-size:10px;color:var(--online)}
.tier-chip{font-family:var(--mono);font-size:11px;color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:2px 9px}
.fighter-mini{display:flex;flex-direction:column;gap:4px;align-items:center;min-width:88px}
.fighter-mini .sig{width:52px;height:52px;border-radius:9px;background:#0c1220;border:1px solid var(--hair)}
.fighter-mini .fname{font-size:11.5px;font-weight:600;text-align:center;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fighter-mini .hpbar{width:100%;margin-top:2px}
.fighter-mini.dead{opacity:.35;filter:grayscale(1)}
.team-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
@media(max-width:720px){.app{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.rail .foot{display:none}.main{padding:18px}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="14" stroke="var(--aether)" stroke-width="1.5"/><path d="M16 4 L26 22 H6 Z" stroke="var(--aether)" stroke-width="1.5" fill="rgba(139,124,246,.12)"/><circle cx="16" cy="17" r="3" fill="var(--aether)"/></svg>
      <b>AETHER</b>
    </div>
    <div class="navitem" data-view="scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="2"/><path d="M8 12a4 4 0 018 0M5 12a7 7 0 0114 0"/></svg>Rifts</div>
    <div class="navitem" data-view="nest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 12l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>The Nest</div>
    <div class="navitem" data-view="bastion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 21V9l4-3 4 3 4-3 4 3v12"/><path d="M4 21h16M10 21v-5h4v5"/></svg>Bastion</div>
    <div class="navitem" data-view="pulse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Pulse</div>
    <div class="navitem" data-view="compass"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Compass<span id="cmp-dot" class="cl-dot" hidden></span></div>
    <div class="navitem" data-view="records"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V5M4 19h16"/><path d="M7 15l4-5 3 3 5-7"/></svg>Records</div>
    <div class="navitem" data-view="changelog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3h9l4 4v14H6z"/><path d="M9 9h7M9 13h7M9 17h4"/></svg>Changelog<span id="cl-dot" class="cl-dot" hidden></span></div>
    <div class="navitem" data-view="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Dashboard</div>
    <div class="foot muted">
      <div><span class="dot"></span>Anchor online</div>
      <div class="mono" id="foot-net"></div>
      <div class="reset-link" onclick="confirmReset()">Reset progression</div>
    </div>
  </nav>
  <div style="display:flex;flex-direction:column;min-width:0">
    <div class="resbar" id="resbar"></div>
    <main class="main" id="main"></main>
  </div>
</div>
<div id="modal-root"></div>
<script>
const $ = (s,el=document)=>el.querySelector(s);
const api = async (path, opts={})=>{
  const r = await fetch(path, {headers:{'Content-Type':'application/json'}, ...opts});
  return r.json();
};
const EL_COLORS = {Ember:"#F0714A",Tide:"#3FA9D6",Volt:"#E8C84D",Loam:"#B08A54",Gale:"#8FD6B4",Frost:"#7FCBEB",Lumen:"#F4E9B8",Umbra:"#8B7CF6",Ferro:"#A6B0BE",Plasma:"#E86AD0"};
const ESS_COLORS={ferro:"#A6B0BE",tide:"#3FA9D6",loam:"#B08A54",volt:"#E8C84D",umbra:"#8B7CF6",plasma:"#E86AD0"};
const state = {view:'scan', devices:[], roster:[], net:{}, res:{}, rates:{}};

/* ---------- number formatting + resource bar ---------- */
function fmt(n){
  if(n>=1e12)return (n/1e12).toFixed(2)+'T';
  if(n>=1e9)return (n/1e9).toFixed(2)+'B';
  if(n>=1e6)return (n/1e6).toFixed(2)+'M';
  if(n>=1e3)return (n/1e3).toFixed(1)+'K';
  return n>=100?Math.round(n):(Math.round(n*10)/10);
}
function renderResBar(){
  const r=state.res||{}, rates=state.rates||{};
  const items=[];
  const bits=r.bits||0;
  items.push({key:'bits',name:'Bits',val:bits,rate:rates.bits,color:'#DCE3EE'});
  if(r.cores>0||rates.cores)items.push({key:'cores',name:'Cores',val:r.cores||0,rate:rates.cores,color:'#E8C84D'});
  if(r.aethercite>0)items.push({key:'aethercite',name:'Aethercite',val:r.aethercite,color:'#7FCBEB'});
  for(const k of Object.keys(r).filter(k=>k.startsWith('essence.')&&r[k]>=0.1).sort()){
    const kind=k.split('.')[1];
    items.push({key:k,name:kind,val:r[k],rate:rates[k],color:ESS_COLORS[kind]||'#8B7CF6'});
  }
  const bar=$('#resbar');
  bar.innerHTML=items.map(i=>`<span class="res"><span class="rdot" style="background:${i.color}"></span><span class="rname">${i.name}</span><span class="rval" data-res="${i.key}">${fmt(i.val)}</span>${i.rate?`<span class="rrate">+${fmt(i.rate)}/h</span>`:''}</span>`).join('')
    || `<span class="res"><span class="rname" style="color:var(--dim)">clear rift nodes to start earning</span></span>`;
}
async function pollState(){
  try{
    const st=await api('/api/state');
    const changed = state.sig !== undefined && st.sig !== state.sig;
    state.sig = st.sig;
    const oldBits=state.res.bits||0;
    state.res=st.resources||{};state.rates=st.rates||{};state.net=st;
    renderResBar();
    if((state.res.bits||0)>oldBits+0.05){
      const el=document.querySelector('[data-res="bits"]');
      if(el){el.classList.add('bump');setTimeout(()=>el.classList.remove('bump'),600);}
    }
    // something actually happened out there — an egg hatched, an expedition
    // dug a layer, the Null arrived. Only then is a redraw worth it.
    if(changed) await redrawView();
  }catch(e){}
}
setInterval(pollState, 10000);

/* ---------- refreshing ----------
   Two triggers, no blind timer:
     1. refreshNow() right after anything you do that changes the world
     2. a redraw when the server's structural fingerprint changes, so idle
        events (hatching, expeditions, incursions) still surface on their own
   The resource bar keeps updating independently either way. */

async function redrawView(){
  if(uiBusy() || state.refreshing) return;
  state.refreshing=true;
  const y=window.scrollY;
  try{
    if(state.view==='scan' && state.currentRift){ await riftView(state.currentRift); }
    else if(state.view==='scan'){
      // redraw from known devices — never auto-trigger a network scan
      if(state.devices && state.devices.length){ await hydrateRifts(); renderRifts(); }
    }
    else if(state.view==='nest'){ await nestView(); }
    else if(state.view==='bastion'){ await bastionView(); }
    else if(state.view==='pulse'){ await pulseView(); }
    else if(state.view==='dash'){ await dashView(); }
    else if(state.view==='changelog'){ /* static; no redraw needed */ }
    else if(state.view==='records'){ /* sampled hourly; no need to chase it */ }
    else if(state.view==='compass'){ await compassView(); }
  }catch(e){ /* transient failure: the next check will catch up */ }
  window.scrollTo(0,y);
  state.refreshing=false;
}

function uiBusy(){
  if(document.hidden) return true;                       // tab in background
  if(document.querySelector('.overlay')) return true;    // modal or battle open
  const a=document.activeElement;
  if(a && ['SELECT','INPUT','TEXTAREA'].includes(a.tagName)) return true;
  return false;
}

// call after any action that changes the world
async function refreshNow(){ state.sig=undefined; await pollState(); await redrawView(); }

// coming back to the tab shouldn't mean staring at stale numbers
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) pollState(); });

/* ---------- procedural SVG sigils (visual identity from the seed) ---------- */
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h;}
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
// device rift sigil: symmetric radial glyph seeded by MAC
function riftSigil(mac,color){
  const rnd=mulberry(hashStr(mac));
  const arms=3+Math.floor(rnd()*6), rings=1+Math.floor(rnd()*3), cx=28,cy=28;
  let p=`<svg viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">`;
  p+=`<defs><radialGradient id="g${hashStr(mac)}"><stop offset="0%" stop-color="${color}" stop-opacity=".9"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></radialGradient></defs>`;
  p+=`<circle cx="28" cy="28" r="24" fill="url(#g${hashStr(mac)})" opacity=".25"/>`;
  for(let r=0;r<rings;r++){const rad=8+r*7+rnd()*3;p+=`<circle cx="28" cy="28" r="${rad}" fill="none" stroke="${color}" stroke-width="1" opacity="${.5-r*.1}"/>`;}
  for(let a=0;a<arms;a++){const ang=(a/arms)*Math.PI*2+rnd()*.3;const len=14+rnd()*8;const x=cx+Math.cos(ang)*len,y=cy+Math.sin(ang)*len;p+=`<line x1="28" y1="28" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${color}" stroke-width="1.4" opacity=".8"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(1.5+rnd()*2).toFixed(1)}" fill="${color}"/>`;}
  p+=`<circle cx="28" cy="28" r="3.4" fill="${color}"/></svg>`;
  return p;
}
// daemon sigil from its backend sigil spec + seed
function daemonSigil(d){
  const s=d.sigil||{}, color=d.color||"#8B7CF6";
  const rnd=mulberry(hashStr(d.seed||d.name));
  const arms=s.arms||5, cx=30,cy=30;
  let p=`<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">`;
  p+=`<defs><radialGradient id="d${d.seed}"><stop offset="0%" stop-color="${color}" stop-opacity=".85"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></radialGradient></defs>`;
  p+=`<circle cx="30" cy="30" r="26" fill="url(#d${d.seed})" opacity=".3"/>`;
  // body blob (symmetric)
  let pts=[];const lobes=arms;
  for(let i=0;i<=lobes;i++){const ang=(i/lobes)*Math.PI*2;const rad=13+Math.sin(ang*2+(s.jitter||0)*6)*4+rnd()*3;pts.push([cx+Math.cos(ang)*rad,cy+Math.sin(ang)*rad]);}
  p+=`<polygon points="${pts.map(pt=>pt[0].toFixed(1)+','+pt[1].toFixed(1)).join(' ')}" fill="${color}" opacity=".18" stroke="${color}" stroke-width="1.3"/>`;
  // eyes
  const eyes=s.eyes||2;for(let e=0;e<eyes;e++){const ex=cx+(e-(eyes-1)/2)*7;p+=`<circle cx="${ex}" cy="28" r="2.4" fill="${color}"/>`;}
  p+=`<text x="30" y="46" font-size="9" text-anchor="middle" fill="${color}" opacity=".8" font-family="monospace">${s.glyph||'◇'}</text>`;
  p+=`</svg>`;return p;
}

/* ---------- meters ---------- */
const METER_COLOR={hunger:"#8FD6B4",energy:"#7FCBEB",happiness:"#E8C84D",discipline:"#8B7CF6",corruption:"#E86AD0",weight:"#A6B0BE"};
function meter(label,val,key){
  const v=Math.round(val),col=METER_COLOR[key]||"#8B7CF6";
  return `<div class="meter"><span class="muted">${label}</span><div class="track"><i style="width:${v}%;background:${col}"></i></div><span class="mono">${v}</span></div>`;
}

/* ---------- views ---------- */
async function boot(){
  const st=await api('/api/state');
  state.net=st;state.res=st.resources||{};state.rates=st.rates||{};
  renderResBar();
  // once per page load, never on the polling loop — /api/visit stamps the
  // "last seen" time, so calling it every 10s would mean you were never away
  checkChangelog();
  checkHomecoming();
  $('#foot-net').textContent=(st.local_ip||'')+(st.subnet? '\n'+st.subnet:'');
  const foot=document.querySelector('.rail .foot');
  if(foot&&st.version)foot.insertAdjacentHTML('beforeend',`<div class="mono" style="color:var(--dim)">v${st.version}</div>`);
  document.querySelectorAll('.navitem').forEach(n=>n.onclick=()=>go(n.dataset.view));
  if(!st.bootstrapped){return bootstrapView();}
  await refreshRoster();
  go('scan');
}
function setActive(v){document.querySelectorAll('.navitem').forEach(n=>n.classList.toggle('active',n.dataset.view===v));}
function go(v){
  // the dashboard isn't a normal view: it hides the chrome and owns the URL
  // hash, so route it through its own toggle rather than the view table
  if(v==='dash') return toggleDash();
  state.view=v;state.currentRift=null;setActive(v);({scan:scanView,nest:nestView,pulse:pulseView,bastion:bastionView,dash:dashView,changelog:changelogView,records:recordsView,compass:compassView}[v]||scanView)();}

/* -- first run: hatch the Anchor egg -- */
function bootstrapView(){
  $('#main').innerHTML=`
    <div class="topbar"><div><div class="eyebrow">First contact</div><h1>Hatch your Anchor daemon</h1></div></div>
    <div class="card" style="padding:34px;text-align:center;max-width:460px;margin:30px auto">
      <div style="width:110px;height:110px;margin:0 auto 18px">${riftSigil(state.net.local_ip||'anchor','#8B7CF6')}</div>
      <p class="muted" style="margin:0 0 22px">Every AETHER install anchors to the device it runs on. An egg is stirring in the subspace between your services. Hatch it to begin — then scan your network to find rifts.</p>
      <button class="btn primary" id="hatch">Hatch the egg</button>
    </div>`;
  $('#hatch').onclick=async()=>{
    $('#hatch').disabled=true;$('#hatch').textContent='Hatching…';
    const r=await api('/api/bootstrap',{method:'POST'});
    toast(`${r.daemon.name} hatched!`);
    await refreshRoster();go('nest');
  };
}

/* -- rifts / scan -- */
async function scanView(){
  $('#main').innerHTML=`
    <div class="topbar">
      <div><div class="eyebrow">Local subspace</div><h1>Rifts on your network</h1></div>
      <div style="display:flex;gap:9px">
        <button class="btn" id="manual">Add device</button>
        <button class="btn primary" id="scan">Sweep with the Array</button>
      </div>
    </div>
    <div id="scanmeta" class="muted mono" style="font-size:12px;margin-bottom:14px"></div>
    <div id="rifts"></div>`;
  $('#scan').onclick=()=>runScan();
  $('#manual').onclick=manualDialog;
  const known=await api('/api/devices');
  if(known.devices && known.devices.length){
    state.devices=known.devices;
    $('#scanmeta').textContent=`${known.devices.length} rift(s) resolved`;
    await hydrateRifts();renderRifts();
  } else {
    runScan(true);
  }
}
async function hydrateRifts(){
  for(const d of state.devices){
    d.rift=await api(`/api/rift/${d.mac}?hostname=${encodeURIComponent(d.hostname||'')}`);
  }
}
async function runScan(quiet){
  $('#rifts').innerHTML=`<div class="spin"></div>`;
  $('#scanmeta').textContent='Sweeping subnet & reading ARP table…';
  let res=await api('/api/scan');
  if(!res.devices || !res.devices.length){
    res=await api('/api/scan?mock=1');

}

/* -- the shaft: 100 layers, gatekeepers every 25, a shelf every 10 -- */

/* -- the shaft in cross-section: the rift as a place, not a list --
   A vertical cut through all 100 layers at once. The list beside it shows the
   handful of layers you can act on; this shows where those sit in the whole
   descent, where your daemons are actually standing, and how far the dark
   still goes. */
function renderCrossSection(r){
  const total=r.layers||100, depth=r.progress.cleared;
  const H=560, W=132, top=16, floor=H-16, span=floor-top;
  const y=L=>top+(L/total)*span;                 // layer -> pixels, surface at top

  // strata: every 25 layers is a band, darkening with depth
  const bands=[];
  for(let b=0;b<4;b++){
    const from=b*25, to=(b+1)*25;
    bands.push(`<rect x="26" y="${y(from)}" width="62" height="${y(to)-y(from)}"
      fill="rgb(${18-b*2},${24-b*4},${44-b*7})"/>`);
  }
  // conquered ground
  const dug=`<rect x="26" y="${y(0)}" width="62" height="${Math.max(0,y(depth)-y(0))}"
    fill="url(#dugGrad)"/>`;

  // gatekeepers
  const gks=[25,50,75,100].map(L=>{
    const passed=depth>=L, yy=y(L);
    return `<g opacity="${passed?1:0.5}">
      <line x1="20" y1="${yy}" x2="94" y2="${yy}" stroke="${passed?'#E8C84D':'#4a3a2a'}" stroke-width="1.6"/>
      <text x="99" y="${yy+3.5}" font-size="9" fill="${passed?'#E8C84D':'#4a3a2a'}"
        font-family="ui-monospace,monospace">${L}</text></g>`;}).join('');

  // shelves you've reached
  const every=r.harvest_every||5;
  const shelves=[];
  for(let L=every;L<=depth;L+=every){
    shelves.push(`<line x1="26" y1="${y(L)}" x2="88" y2="${y(L)}"
      stroke="rgba(139,124,246,.30)" stroke-width="0.8"/>`);
  }

  // daemons at their posts — the point of the whole picture
  const posted=Object.entries(r.harvests||{}).map(([L,h])=>{
    const yy=y(+L);
    return `<g class="xs-worker"><title>${h.name} — layer ${L}</title>
      <circle cx="57" cy="${yy}" r="5.5" fill="${h.color}" opacity=".95"/>
      <circle cx="57" cy="${yy}" r="9" fill="none" stroke="${h.color}" stroke-width="1" opacity=".35"/>
    </g>`;}).join('');

  // the frontier
  const fy=y(depth);
  const frontier=depth<total?`
    <line x1="18" y1="${fy}" x2="96" y2="${fy}" stroke="var(--aether)" stroke-width="2"/>
    <circle cx="57" cy="${fy}" r="3" fill="var(--aether)"/>
    <text x="18" y="${fy-9}" font-size="8.5" fill="var(--aether)"
      stroke="#0a0f1c" stroke-width="2.6" paint-order="stroke"
      font-family="ui-monospace,monospace">layer ${depth}</text>`:'';

  return `<svg class="xsec" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMin meet">
    <defs>
      <linearGradient id="dugGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#8B7CF6" stop-opacity=".30"/>
        <stop offset="100%" stop-color="#8B7CF6" stop-opacity=".08"/>
      </linearGradient>
    </defs>
    <text x="26" y="10" font-size="8.5" fill="#5a6884" font-family="ui-monospace,monospace">SURFACE</text>
    ${bands.join('')}${dug}${shelves.join('')}${gks}${posted}${frontier}
    <rect x="26" y="${top}" width="62" height="${span}" fill="none"
      stroke="var(--hair)" stroke-width="1"/>
  </svg>`;
}

function renderDescent(r){
  const total=r.layers||100, depth=r.progress.cleared, win=r.window||[];
  const pct=Math.round(100*depth/total);
  // milestone ticks along the depth bar
  const ticks=[];
  for(let L=10;L<=total;L+=10){
    const reached=depth>=L, gk=L%25===0;
    ticks.push(`<span class="tick ${reached?'hit':''} ${gk?'gk':''}" style="left:${100*L/total}%" title="Layer ${L}${gk?' · Gatekeeper':''}"></span>`);
  }
  const layers=win.map(L=>{
    const st=L.state;
    const cls=st==='cleared'?'done':st==='frontier'?'front':'locked';
    const tags=[
      L.is_gatekeeper?'<span class="ltag gk">GATEKEEPER</span>':'',
      L.capture_layer?'<span class="ltag cap">CAPTURE</span>':(L.harvest_shelf?'<span class="ltag cap">SHELF</span>':''),
      L.foes>1?`<span class="ltag">${L.foes} foes</span>`:''
    ].join('');
    return `<div class="layer ${cls}" data-layer="${L.layer}" style="--i:${L.layer%14}">
      <div class="lnum">${String(L.layer).padStart(3,'0')}</div>
      <div class="lbody">
        <div class="lhead">Lv${L.enemy_level} · pw${fmt(L.power)}${r.dormant?' <span style="color:var(--aether)">+dormant</span>':''}</div>
        <div class="ltags">${tags||'<span class="ltag dim">clear passage</span>'}</div>
      </div>
      <div class="lact">${st==='frontier'?'<button class="btn primary" data-dig="'+L.layer+'">Descend</button>':st==='cleared'?'<span class="mono" style="color:var(--online);font-size:11px">cleared</span>':'<span class="mono muted" style="font-size:11px">sealed</span>'}</div>
    </div>`;}).join('');

  // shelves: every cleared multiple of 10 is a harvest post
  const shelves=[];
  const shelfEvery=r.harvest_every||5;
  for(let L=shelfEvery;L<=depth;L+=shelfEvery){
    const hv=r.harvests&&r.harvests[String(L)];
    let inner;
    if(hv){
      const rate=Object.entries(hv.rates).map(([k,v])=>`+${fmt(v)} ${k.replace('essence.','')}/h`).join(' · ');
      const essKey=Object.keys(hv.rates).find(k=>k.startsWith('essence.'));
      const essName=essKey?essKey.split('.')[1]:'';
      const bitsHr=hv.rates.bits||0;
      inner=`<div class="hv-who"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${hv.color}"></span> ${hv.name}</div>
             <canvas class="flow" data-flow="${L}" data-tint="${ESS_COLORS[essName]||hv.color}" data-rate="${bitsHr}"></canvas>
             <div class="hv-rate">${rate}</div><div class="hv-life">${fmt(hv.lifetime_bits)} Bits gathered</div>
             <button class="btn ghost" data-stopharvest="${hv.daemon_id}">Stop</button>`;
    } else {
      const free=state.roster.filter(d=>!d.on_expedition&&!d.harvesting&&!d.training);
      inner=`<div class="muted" style="font-size:11px">post open</div>${free.length?`<select data-assign="${L}"><option value="">assign daemon…</option>${free.map(d=>`<option value="${d.id}">${d.name} · pw${d.power}</option>`).join('')}</select>`:'<div class="muted" style="font-size:10px;margin-top:4px">no free daemons</div>'}`;
    }
    shelves.push(`<div class="shelf" data-shelf="${L}"><div class="slabel">Layer ${L}</div>${inner}</div>`);
  }

  const M = r.mastery || {level:1, pct:0, milestones:[]};
  const mast = `
    <div class="mastery">
      <div class="mast-h">
        <span class="mast-lvl">Mastery ${M.level}<span class="muted">/99</span></span>
        <span class="mono muted" style="font-size:11px">${fmt(M.into||0)} / ${fmt(M.need||0)} xp${r.resonance>1?` · resonance ×${r.resonance}`:''}</span>
      </div>
      <div class="mast-bar"><i style="width:${M.pct||0}%"></i></div>
      <div class="mast-ms">${(M.milestones||[]).map(x=>
        `<span class="ms ${x.have?'have':''}" title="${x.desc}">${x.level} · ${x.name}</span>`).join('')}</div>
    </div>`;
  return `
    ${mast}
    <div class="depthbar"><i style="width:${pct}%"></i>${ticks.join('')}</div>
    <div class="depthline mono">layer <b>${depth}</b> / ${total}${r.next_capture_layer?` · next capture at layer ${r.next_capture_layer}`:''}${r.captures_available>0?` · <span style="color:var(--warn)">${r.captures_available} ready to draw</span>`:''}</div>
    <div class="descent-split">
      ${renderCrossSection(r)}
      <div class="shaft">${layers}</div>
    </div>
    ${shelves.length?`<div class="section-title">Harvest posts</div><div class="shelves">${shelves.join('')}</div>`:''}
  `;
}

function renderPicker(dev){
  // Harvesters and trainees can be BORROWED for a fight and go back to work
  // afterward — only expeditions put a daemon out of reach.
  const avail=state.roster.filter(d=>!d.on_expedition);
  if(!state.roster.length){$('#picker').innerHTML=`<div class="muted" style="font-size:13px;margin-bottom:8px">No daemons yet — hatch or capture one in The Nest.</div>`;return;}
  if(!avail.length){$('#picker').innerHTML=`<div class="muted" style="font-size:13px;margin-bottom:8px">Every daemon is away on an expedition. Recall one to fight.</div>`;state.party=[];return;}
  state.party=(state.party||[]).filter(id=>avail.find(d=>d.id===id));
  if(!state.party.length)state.party=[avail[0].id];
  $('#picker').innerHTML=`<div class="muted" style="font-size:12px;margin-bottom:6px">Party (tap to toggle, up to 3):</div><div class="picker">${
    avail.map(d=>{const idx=state.party.indexOf(d.id);
      const busy=d.harvesting?'harvesting':d.training?'training':'';
      return `<div class="pick ${idx>=0?'in-party':''}" data-id="${d.id}" title="${busy?'Will be borrowed from '+busy+' and return afterward':''}">${idx>=0?`<span class="pnum">${idx+1}</span>`:''}<span class="dot" style="background:${d.color}"></span>${d.name} <span class="muted mono" style="font-size:11px">Lv${d.level} pw${d.power}${busy?' · '+busy:''}</span></div>`;}).join('')
  }</div>`;
  refreshSynergy();
  $('#picker').querySelectorAll('.pick').forEach(el=>el.onclick=()=>{
    const id=+el.dataset.id, i=state.party.indexOf(id);
    if(i>=0)state.party.splice(i,1);
    else{if(state.party.length>=3){toast('Party is full (3 max)');return;}state.party.push(id);}
    renderPicker(dev);renderExpedBar(dev);
  });
}
async function refreshSynergy(){
  const host=$('#picker'); if(!host||!state.party||!state.party.length)return;
  let box=document.getElementById('syn');
  if(!box){ box=document.createElement('div'); box.id='syn'; host.appendChild(box); }
  try{
    const r=await api('/api/party/synergy',{method:'POST',
      body:JSON.stringify({daemon_ids:state.party})});
    box.innerHTML=(r.synergies||[]).map(x=>
      `<span class="syn" title="${x.desc}">${x.name}</span>`).join('')
      || '<span class="syn none">no synergy — try mixing elements or attributes</span>';
  }catch(e){ box.innerHTML=''; }
}

function renderOverclock(dev){
  const r=dev.rift;
  if(!r.fully_cleared)return;
  const host=$('#exped-bar');
  const oc = Object.entries(r.overclock_cost||{}).map(([k,v])=>`${fmt(v)} ${k}`).join(' + ');
  const party = (state.roster||[]).filter(d=>!d.on_expedition).slice(0,3);
  const partyPw = party.reduce((a,d)=>a+d.power,0);
  const next = r.next_tier_boss_power||0;
  const risky = next > partyPw*1.15;
  host.insertAdjacentHTML('afterend',`<div class="card" style="border-color:var(--warn);padding:13px 16px;margin-bottom:12px;max-width:680px">
    <div style="display:flex;align-items:center;gap:14px">
      <div style="flex:1"><b style="color:var(--warn)">Fully stabilized.</b> <span class="muted" style="font-size:13px">Overclock to Tier ${r.progress.tier+1}: the rift resets — enemies ×1.6 stronger, all yields ×2. Harvesters will withdraw.</span></div>
      <button class="btn" style="border-color:var(--warn);color:var(--warn)" id="overclock">Overclock${oc?` · ${oc}`:''}</button>
    </div>
    <div class="mono" style="font-size:11px;margin-top:9px;color:${risky?'var(--danger)':'var(--muted)'}">
      next Gatekeeper ≈ pw${fmt(next)} + minions · your party pw${fmt(partyPw)}${risky?' — you would likely lose this. You can Downclock later if you overreach.':''}
    </div></div>`);
  $('#overclock').onclick=async()=>{
    const res=await api('/api/overclock',{method:'POST',body:JSON.stringify({mac:dev.mac})});
    if(res.error||!res.ok){toast(res.reason||res.error||'Cannot overclock');return;}
    toast(`OVERCLOCKED — Tier ${res.tier}`);await refreshRoster();riftView(dev);
  };
}

function renderIncursion(dev){
  const r=dev.rift, host=$('#inc-host');
  if(!r.incursion){host.innerHTML='';return;}
  const inc=r.incursion;
  const avail=state.roster.filter(d=>!d.on_expedition&&!d.training);
  const eta=s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h?`${h}h ${m}m`:`${m}m ${s%60}s`;};
  host.innerHTML=`<div class="card inc-panel" style="margin-bottom:16px">

      <div><h3 style="font-size:17px">⚠ NULL INCURSION</h3>

      <div style="margin-left:auto;text-align:right"><div class="inc-count" id="inc-count">${eta(inc.seconds_left)}</div><div class="mono muted" style="font-size:10px">until the Null strikes</div></div>
    </div>
    <div style="display:flex;gap:7px;margin:10px 0;flex-wrap:wrap">${inc.nulls.map(n=>`<span class="null-chip">${n.name} · Lv${n.level} · pw${n.power}</span>`).join('')}</div>

    </div></div>`;

/* -- the bastion: base building -- */
async function bastionView(){
  await refreshRoster();
  const b=await api('/api/bastion');
  const KIND_LABEL={hall:'Training halls',support:'Support',automation:'Automations',war:'War'};
  const order=['hall','support','automation','war'];
  let html=`<div class="topbar"><div><div class="eyebrow">Your anchor, fortified</div><h1>The Bastion</h1></div></div>`;
  for(const kind of order){
    const entries=Object.entries(b.facilities).filter(([k,f])=>f.kind===kind);
    if(!entries.length)continue;
    html+=`<div class="section-title">${KIND_LABEL[kind]}</div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">`;
    for(const [key,f] of entries){
      const cost=Object.entries(f.next_cost).map(([k,v])=>`${fmt(v)} ${k.replace('essence.','')}`).join(' + ');
      const affordable=Object.entries(f.next_cost).every(([k,v])=>(state.res[k]||0)>=v);
      let occHtml='';
      if(f.kind==='hall'&&f.level>0){
        occHtml=f.occupants.map(o=>`<div class="occ"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:${o.color}"></span>${o.name}<span class="mono">+${o.gained} ${f.stat.toUpperCase()} · ${o.hours}h</span><button class="btn ghost" style="margin-left:auto;padding:3px 8px;font-size:10.5px" data-withdraw="${o.daemon_id}">Out</button></div>`).join('');
        const free=state.roster.filter(d=>!d.on_expedition&&!d.harvesting&&!d.training);  // expeditions ARE exclusive
        if(f.occupants.length<f.slots&&free.length){
          occHtml+=`<select data-enroll="${key}"><option value="">enroll daemon… (${f.occupants.length}/${f.slots} slots)</option>${free.map(d=>`<option value="${d.id}">${d.name} · ${f.stat.toUpperCase()} ${d.battle_stats[f.stat]}</option>`).join('')}</select>`;
        } else if(f.occupants.length>=f.slots){
          occHtml+=`<div class="muted mono" style="font-size:10.5px">${f.occupants.length}/${f.slots} slots — full</div>`;
        }
      }
      html+=`<div class="card fac ${f.level===0?'unbuilt':''}" data-fac="${key}">
        <div class="fhead"><h3>${f.name}</h3><span class="flevel">${f.level===0?'UNBUILT':'LV '+f.level}</span></div>
        <div class="fdesc">${f.desc}</div>
        <div class="feffect">${f.effect}</div>
        ${f.gate?`<div class="mono" style="font-size:10.5px;color:var(--warn)">locked · dig ${fmt(f.gate.need_layers)} layers network-wide (${fmt(f.gate.have_layers)} so far)</div>`:''}
        ${occHtml}
        <div style="display:flex;align-items:center;gap:10px;margin-top:auto">
          <button class="btn ${f.level===0?'primary':''}" data-upgrade="${key}" ${affordable?'':'disabled'}>${f.level===0?'Build':'Upgrade'}</button>
          <span class="fcost">${cost}</span>
        </div></div>`;
    }
    html+=`</div>`;
  }
  html+=`<div class="section-title">Glyphs</div><div id="glyphs"><div class="spin"></div></div>`;
  $('#main').innerHTML=html;
  renderGlyphs();
  $('#main').querySelectorAll('[data-upgrade]').forEach(btn=>btn.onclick=async()=>{
    const res=await api('/api/bastion/upgrade',{method:'POST',body:JSON.stringify({key:btn.dataset.upgrade})});
    if(!res.ok){toast(res.reason==='cant_afford'?'Not enough resources':'Cannot upgrade');return;}
    toast(`${btn.dataset.upgrade.replace('_',' ')} → level ${res.level}`);pollState();bastionView();
  });
  $('#main').querySelectorAll('[data-enroll]').forEach(sel=>sel.onchange=async()=>{
    if(!sel.value)return;
    const res=await api('/api/bastion/train',{method:'POST',body:JSON.stringify({daemon_id:+sel.value,hall:sel.dataset.enroll})});
    if(res.error||!res.ok){toast(res.message||res.reason||'Cannot enroll');return;}
    toast('Training begun');bastionView();
  });
  $('#main').querySelectorAll('[data-withdraw]').forEach(btn=>btn.onclick=async()=>{
    const res=await api('/api/bastion/withdraw',{method:'POST',body:JSON.stringify({daemon_id:+btn.dataset.withdraw})});
    if(res.error){toast(res.error);return;}
    toast('Withdrawn from training');bastionView();
  });
}

/* -- glyphs: craftable equipment -- */
async function renderGlyphs(){
  const host=$('#glyphs'); if(!host)return;
  const g=await api('/api/glyphs');
  const res=g.resources||{};
  const afford=c=>Object.entries(c).every(([k,v])=>(res[k]||0)>=v);
  const costStr=c=>Object.entries(c).map(([k,v])=>`${fmt(v)} ${k.replace('essence.','')}`).join(' + ');

  const bench=g.catalogue.map(c=>`
    <div class="card gly">
      <div class="gly-h"><b>${c.name}</b><span class="mono muted" style="font-size:10.5px">${c.essence}</span></div>
      <div class="gly-qs">${c.qualities.map(q=>`
        <button class="btn ghost gq ${afford(q.cost)?'':'poor'}" data-craft="${c.kind}" data-q="${q.quality}"
          title="${costStr(q.cost)}">Q${q.quality} · ${q.desc}</button>`).join('')}</div>
    </div>`).join('');

  const free=g.owned.filter(x=>!x.daemon_id), worn=g.owned.filter(x=>x.daemon_id);
  const roster=(state.roster||[]);
  const inv=g.owned.length?`
    <div class="section-title" style="margin-top:14px">Struck glyphs</div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr))">
      ${g.owned.map(x=>`<div class="card gly-own">
        <div><b>${x.name}</b> <span class="mono muted">Q${x.quality}</span></div>
        <div class="mono" style="color:var(--online);font-size:11.5px">${x.desc}</div>
        <select data-equip="${x.id}">
          <option value="">${x.holder?'worn by '+x.holder:'unequipped'}</option>
          ${x.daemon_id?'<option value="0">— take it off —</option>':''}
          ${roster.filter(d=>d.id!==x.daemon_id).map(d=>`<option value="${d.id}">give to ${d.name} (${(d.equipped||[]).length}/${d.glyph_slots})</option>`).join('')}
        </select></div>`).join('')}
    </div>`:'';

  host.innerHTML=`<div class="muted" style="font-size:13px;margin-bottom:10px">
      Ascension makes a daemon flatly stronger; glyphs decide what it's <i>for</i>.
      Quality is paid for, never rolled. ${free.length} unworn · ${worn.length} in use.</div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${bench}</div>${inv}`;

  host.querySelectorAll('[data-craft]').forEach(b=>b.onclick=async()=>{
    const r=await api('/api/glyphs/craft',{method:'POST',
      body:JSON.stringify({kind:b.dataset.craft,quality:+b.dataset.q})});
    if(r.error){toast(r.error==='cant_afford'?'Not enough to strike that':r.error);return;}
    toast(`Struck: ${r.desc}`); pollState(); renderGlyphs();
  });
  host.querySelectorAll('[data-equip]').forEach(sel=>sel.onchange=async()=>{
    if(sel.value==='')return;
    const r=await api('/api/glyphs/equip',{method:'POST',
      body:JSON.stringify({glyph_id:+sel.dataset.equip,daemon_id:+sel.value})});
    if(r.error){toast(r.message||r.error);return;}
    toast(r.equipped?'Glyph fitted':'Glyph removed');
    await refreshRoster(); renderGlyphs();
  });
}

async function pulseView(){

async function loadJournal(){
  const r=await api('/api/journal?limit=80');
  const j=$('#journal'); if(!j) return;
  if(!r.events.length){j.innerHTML=`<div class="empty">Silence in the subspace. Scan for rifts, dispatch expeditions, and this feed comes alive — it keeps recording even while you're away.</div>`;return;}
  j.innerHTML=r.events.map(e=>`<div class="jrow k-${e.kind}">
    <span class="jtime">${relTime(e.ts)}</span><span class="jtext">${e.text}</span>
  </div>`).join('');
}
function relTime(ts){
  const s=Math.max(1,(Date.now()/1000)-ts);
  if(s<60)return Math.floor(s)+'s ago';
  if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}

async function showTeamBattle(b,teamA,teamB,won,subtitle){
  const mini=(d,key)=>`<div class="fighter-mini" data-f="${key}"><div class="sig">${daemonSigil(d)}</div><div class="fname">${d.name}</div><div class="mono muted" style="font-size:9.5px">Lv${d.level}</div><div class="hpbar ${key[0]==='b'?'foe':''}"><i style="width:100%"></i></div></div>`;
  modal(`<div class="theatre card">
    <div style="padding:16px">
      <div class="team-row">${teamA.map((d,i)=>mini(d,'a'+i)).join('')}</div>
      <div style="text-align:center;font-family:var(--display);color:var(--muted);letter-spacing:.2em;padding:8px 0;font-size:13px">VS</div>
      <div class="team-row">${teamB.map((d,i)=>mini(d,'b'+i)).join('')}</div>
    </div>
    <div class="log" id="log"></div>
    <div id="battle-result"></div>
  </div>`);
  const maxHp=b.max_hp, log=$('#log');
  for(const step of b.log){
    await sleep(300);
    for(const [k,v] of Object.entries(step.hp)){
      const f=document.querySelector(`[data-f="${k}"]`);
      if(f){f.querySelector('.hpbar i').style.width=(100*v/maxHp[k])+'%';f.classList.toggle('dead',v<=0);}
    }
    const cls=step.actor[0]==='a'?'a':'b';
    const note=step.note?` <span class="muted">[${step.note} ×${step.mult}]</span>`:'';
    log.innerHTML+=`<div class="row"><span class="${cls}">${step.actor_name}</span> → ${step.target_name} for <b class="${step.crit?'crit':''}">${step.dmg}${step.crit?' CRIT':''}</b>${note}</div>`;
    log.scrollTop=log.scrollHeight;
  }
  await sleep(300);
  $('#battle-result').innerHTML=`<div class="result ${won?'win':'lose'}"><h2>${won?'Victory':'Defeat'}</h2><div class="muted" style="margin:6px 0 14px">${subtitle||''}</div><button class="btn primary" onclick="closeModal()">Continue</button></div>`;
}

async function renderHatchery(){
  const h=await api('/api/hatchery');

  const eggs=h.eggs.map(e=>{

  }).join('');
  const picks=h.essence_kinds.map(k=>{

  }).join('');

  });
}

/* -- changelog: what changed, and whether you've read it -- */
function clInline(t){
  // the changelog is written as markdown; render the two bits of it we use
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;')
          .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
          .replace(/`(.+?)`/g,'<code>$1</code>')
          .replace(/\[(.+?)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}

/* ================= RECORDS =================
   Slow-burn progress is invisible without a chart. A month of harvesting looks
   like nothing at all in a resource bar, and "am I actually getting stronger"
   is unanswerable from a single snapshot.

   Drawn as inline SVG from the sampled history — no chart library, same as
   everything else here. */

function spark(points, key, colour, {height=64, fmtY=fmt, area=true}={}){
  const vals = points.map(p => p[key] ?? 0);
  if(vals.length < 2) return `<div class="nodata">not enough history yet — samples are taken hourly</div>`;
  const W = 100, H = height;
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const span = (hi - lo) || 1;
  const x = i => (i/(vals.length-1))*W;
  const y = v => H - ((v-lo)/span)*(H-8) - 4;
  const line = vals.map((v,i) => `${i?'L':'M'}${x(i).toFixed(2)},${y(v).toFixed(2)}`).join(' ');
  const fill = area ? `<path d="${line} L${W},${H} L0,${H} Z" fill="${colour}" opacity=".13"/>` : '';
  return `
    <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${fill}<path d="${line}" fill="none" stroke="${colour}" stroke-width="1.1"
        vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    </svg>
    <div class="sparkfoot"><span>${fmtY(lo)}</span><span>${fmtY(hi)}</span></div>`;
}

/* -- while you were away -- */
function awayLine(sec){
  const h = sec/3600;
  if(h < 1)  return `${Math.round(sec/60)} minutes`;
  if(h < 48) return `${h.toFixed(1)} hours`;
  return `${(h/24).toFixed(1)} days`;
}

/* ================= DASHBOARD =================
   AETHER on a spare monitor. No chrome, no controls, nothing to click —
   numbers large enough to read across a room, the Tank running underneath,
   and anything that actually wants you surfaced as an alert.

   Open it directly at /#dash so a TV or Pi kiosk can boot straight into it,
   toggle with D, leave with Escape. */

function dashAlerts(){
  const out = [];
  for(const d of (state.roster||[])){
    const c = d.care || {};
    if((c.hunger ?? 100) < 25)      out.push({t:'warn', s:`${d.name} is hungry`});
    else if((c.energy ?? 100) < 20) out.push({t:'warn', s:`${d.name} is exhausted`});
    if((c.corruption ?? 0) > 55)    out.push({t:'bad',  s:`${d.name} is corrupting`});
    if(d.can_evolve)                out.push({t:'good', s:`${d.name} can evolve`});
  }
  for(const dev of (state.devices||[])){
    const r = dev.rift; if(!r) continue;
    if(r.incursion) out.push({t:'bad',
      s:`NULL incursion at ${r.world_name} — ${Math.ceil(r.incursion.seconds_left/3600)}h`});
    if(r.captures_available > 0) out.push({t:'good',
      s:`${r.captures_available} daemon(s) ready to draw at ${r.world_name}`});
    if(r.fully_cleared) out.push({t:'good', s:`${r.world_name} is fully dug — Overclock ready`});
  }
  const idle = (state.roster||[]).filter(d => !d.on_expedition && !d.harvesting && !d.training);
  if(idle.length) out.push({t:'warn', s:`${idle.length} daemon(s) idle — no post, no hall`});
  return out;
}
