/* ================= RIFT FLOW =================
   What a working harvest post looks like from outside: essence drawn up out of
   the layer and away to the Bastion. Density follows the post's actual yield,
   so a deep shelf visibly runs harder than a shallow one — the number and the
   picture say the same thing.

   One shared loop for every canvas on screen; it stops dead when the tab is
   hidden or you leave the rift. */

const FLOW = { raf:null, streams:new Map() };

function riftFlowMount(){
  FLOW.streams.clear();
  document.querySelectorAll('canvas.flow').forEach(cv => {
    const rect = cv.getBoundingClientRect();
    if(!rect.width) return;
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    cv.width = rect.width*dpr; cv.height = rect.height*dpr;
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    // yield -> how thick the stream runs, flattened hard so a 100x richer
    // shelf reads as "busier", not as a solid wall of light
    const rate = parseFloat(cv.dataset.rate||'0');
    const density = Math.max(3, Math.min(22, 3 + Math.log10(1+rate)*7));
    const parts = [];
    for(let i=0;i<density;i++) parts.push({
      x: Math.random()*rect.width,
      y: Math.random()*rect.height,
      s: 0.25 + Math.random()*0.75,
      r: 0.6 + Math.random()*1.5,
      a: 0.25 + Math.random()*0.55 });
    FLOW.streams.set(cv, {ctx, w:rect.width, h:rect.height,
                          tint: cv.dataset.tint || '#8B7CF6', parts});
  });
  if(!FLOW.raf && FLOW.streams.size) FLOW.raf = requestAnimationFrame(riftFlowFrame);
}

function riftFlowFrame(){
  FLOW.raf = null;
  if(document.hidden){ FLOW.raf = requestAnimationFrame(riftFlowFrame); return; }
  let alive = false;
  for(const [cv, st] of FLOW.streams){
    if(!cv.isConnected) continue;          // view was redrawn or navigated away
    alive = true;
    const {ctx, w, h, tint, parts} = st;
    ctx.clearRect(0,0,w,h);
    // a dark conduit, so the essence reads as light moving through it rather
    // than as grey speckle on a pale card
    ctx.fillStyle = 'rgba(6,10,20,.72)';
    ctx.fillRect(0,0,w,h);
    const g = ctx.createLinearGradient(0,h,0,0);
    g.addColorStop(0, tint+'30'); g.addColorStop(1, tint+'00');
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);

    ctx.lineCap = 'round';
    for(const p of parts){
      p.y -= p.s*1.9;
      p.x += Math.sin((p.y+p.r*40)/14)*0.25;
      if(p.y < -4){ p.y = h+4; p.x = Math.random()*w; }
      // drawn as a short streak: motion you can see in a still frame
      const len = 3 + p.s*7;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y + len);
      ctx.lineTo(p.x, p.y);
      ctx.strokeStyle = tint;
      ctx.lineWidth = p.r*1.35;
      ctx.globalAlpha = Math.min(1, p.a*1.5) * (0.3 + 0.7*(1 - p.y/h));
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  if(alive) FLOW.raf = requestAnimationFrame(riftFlowFrame);
  else FLOW.streams.clear();
}

/* ================= THE TANK =================
   The Nest, as something to watch rather than read.

   Every creature is drawn from its own genome — element sets the palette,
   stage the size, rarity the finnage and glow — so a daemon looks like itself
   and like its sigil. Nothing here is an asset file; it's all maths.

   Motion carries the care meters, which is the point: you should be able to
   tell the Nest needs you without reading a single bar. Hungry daemons sink
   and slow, tired ones drift, unhappy ones keep to themselves, corrupted ones
   flicker with umbra static. It changes nothing mechanically — watching is
   its own reward, not a bonus.

   Positions live in state.tank keyed by daemon id, so the live-refresh
   redrawing the Nest doesn't teleport everyone back to the middle. */

const TANK = { canvas:null, ctx:null, w:0, h:0, raf:null, motes:[], t:0 };

function tankCreature(d){
  const c = state.tank[d.id] || (state.tank[d.id] = {});
  if(c.x === undefined){
    // deterministic spawn from the daemon's own seed, so it doesn't jump
    // around between sessions
    const n = (d.id * 2654435761) % 1000 / 1000;
    c.x = 0.12 + n * 0.76;
    c.y = 0.2 + ((d.id * 40503) % 1000 / 1000) * 0.6;
    c.vx = (n - 0.5) * 0.0012;
    c.vy = 0;
    c.phase = n * Math.PI * 2;
    c.dart = 0;
  }
  c.d = d;
  return c;
}

function tankSync(){
  state.tank = state.tank || {};
  const live = new Set(state.roster.map(d => d.id));
  for(const id of Object.keys(state.tank)) if(!live.has(+id)) delete state.tank[id];
  return state.roster.map(tankCreature);
}

function tankMount(){
  const cv = document.getElementById('tank');
  if(!cv) return;
  TANK.canvas = cv;
  TANK.ctx = cv.getContext('2d');
  tankResize();
  if(TANK.motes.length === 0){
    for(let i=0;i<44;i++) TANK.motes.push({
      x:Math.random(), y:Math.random(),
      r:0.5+Math.random()*2.1, s:0.00004+Math.random()*0.00014,
      a:0.06+Math.random()*0.16 });
  }
  cv.onclick = (ev) => {
    const r = cv.getBoundingClientRect();
    const px = (ev.clientX - r.left) / r.width, py = (ev.clientY - r.top) / r.height;
    let best = null, bestD = 0.09;          // generous hit area; they're small
    for(const c of Object.values(state.tank || {})){
      if(c.x === undefined) continue;
      const dd = Math.hypot(c.x - px, (c.y - py) * 0.6);
      if(dd < bestD){ best = c; bestD = dd; }
    }
    if(best){
      best.poked = 30;
      best.tx = Math.min(0.92, Math.max(0.08, px + (Math.random()-0.5)*0.4));
      best.ty = Math.min(0.88, Math.max(0.12, py - 0.12));
      const d = best.d, care = d.care || {};
      const say = best.mood === 'sleeping' ? 'is fast asleep'
                : best.mood === 'hungry'   ? 'is hungry'
                : best.mood === 'corrupted'? 'flickers with static'
                : best.mood === 'playful'  ? 'darts away, delighted'
                : 'notices you';
      toast(`${d.name} ${say}`);
    }
  };
  cv.style.cursor = 'pointer';
  if(!TANK.raf) TANK.raf = requestAnimationFrame(tankFrame);
}

function tankResize(){
  const cv = TANK.canvas; if(!cv) return;
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const rect = cv.getBoundingClientRect();
  TANK.w = rect.width; TANK.h = rect.height;
  cv.width = rect.width*dpr; cv.height = rect.height*dpr;
  TANK.ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', () => { if(TANK.canvas) tankResize(); });

const STAGE_SIZE = {Egg:14, Hatchling:20, Rookie:26, Champion:33, Ultimate:40, Mega:48};

function tankFrame(){
  TANK.raf = null;
  const cv = document.getElementById('tank');
  // the Nest was navigated away from, or the tab is hidden: stop burning cycles
  if(!cv || document.hidden){ if(cv) TANK.raf = requestAnimationFrame(tankFrame); return; }
  if(cv !== TANK.canvas){ TANK.canvas = cv; TANK.ctx = cv.getContext('2d'); tankResize(); }

  const ctx = TANK.ctx, W = TANK.w, H = TANK.h;
  TANK.t += 1;
  ctx.clearRect(0,0,W,H);

  // the tank tracks your clock: warm and bright at midday, cold after dark.
  // Purely atmospheric — nothing about the game changes with the hour.
  const hr = new Date().getHours() + new Date().getMinutes()/60;
  const day = Math.max(0, Math.cos((hr - 13) / 24 * 2 * Math.PI));
  const tint = ctx.createLinearGradient(0, 0, 0, H);
  tint.addColorStop(0, `rgba(${Math.round(70+90*day)},${Math.round(70+70*day)},${Math.round(140-20*day)},${0.10+0.10*day})`);
  tint.addColorStop(1, 'rgba(6,10,22,0)');
  ctx.fillStyle = tint; ctx.fillRect(0,0,W,H);

  // ambient drift
  for(const m of TANK.motes){
    m.y -= m.s * 60;
    if(m.y < -0.02){ m.y = 1.02; m.x = Math.random(); }
    ctx.beginPath();
    ctx.arc(m.x*W, m.y*H, m.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(139,124,246,${m.a})`;
    ctx.fill();
  }

  for(const c of tankSync()) tankStep(c, W, H);
  for(const c of tankSync()) tankDraw(ctx, c, W, H);

  TANK.raf = requestAnimationFrame(tankFrame);
}

function tankMood(d){
  const c = d.care || {};
  // one behaviour at a time, most urgent first — a daemon that is both
  // exhausted and starving should read as exhausted, not flicker between them
  if((c.energy ?? 100) < 18)      return 'sleeping';
  if((c.hunger ?? 100) < 25)      return 'hungry';
  if((c.corruption ?? 0) > 55)    return 'corrupted';
  if((c.happiness ?? 100) > 70 && (c.energy ?? 0) > 55) return 'playful';
  return 'idle';
}

function tankStep(c, W, H){
  const d = c.d, care = d.care || {};
  const energy = (care.energy ?? 100)/100;
  const hunger = (care.hunger ?? 100)/100;
  const happy  = (care.happiness ?? 100)/100;
  const corrupt= (care.corruption ?? 0)/100;

  c.mood = tankMood(d);
  c.phase += 0.012 + 0.02*energy;

  if(c.mood === 'sleeping'){
    // settles to the floor and stays there, barely moving
    c.vx *= 0.86; c.vy += 0.00018;
    c.x += c.vx; c.y = Math.min(0.86, c.y + c.vy);
    if(c.y >= 0.86){ c.y = 0.86; c.vy = 0; }
    c.facing = c.facing || 1;
    return;
  }
  if(c.mood === 'playful' && !c.chase && Math.random() < 0.004){
    // pick someone to chase for a while
    const others = Object.values(state.tank).filter(o => o !== c && o.x !== undefined);
    if(others.length) { c.chase = others[Math.floor(Math.random()*others.length)];
                        c.chaseFor = 220; }
  }
  if(c.chase && c.chaseFor-- > 0 && c.chase.x !== undefined){
    c.tx = c.chase.x; c.ty = c.chase.y;
  } else if(c.chase){ c.chase = null; }

  // listless when tired or starving; lively when fed and content
  const vigour = 0.25 + 0.75*energy*(0.4+0.6*hunger);
  if(c.poked > 0){ c.poked--; c.dart = Math.max(c.dart, 18); }
  if(Math.random() < 0.004*vigour) c.dart = 26;          // occasional flick
  const speed = (0.00045 + 0.0011*vigour) * (c.dart>0 ? 3.2 : 1);
  if(c.dart>0) c.dart--;

  // steer toward a wandering target
  if(!c.tx || Math.random()<0.006){
    c.tx = 0.08 + Math.random()*0.84;
    c.ty = 0.14 + Math.random()*0.66;
  }
  const dx = c.tx-c.x, dy = c.ty-c.y;
  const dist = Math.hypot(dx,dy)||1;
  c.vx += (dx/dist)*speed*0.25;
  c.vy += (dy/dist)*speed*0.25;

  // hungry daemons sink; happy ones ride high
  c.vy += (0.35 - hunger*0.30)*0.00022;
  c.vy -= happy*0.00008;

  // gentle personal space — clumped creatures make an unreadable pile of
  // overlapping name labels
  for(const o of Object.values(state.tank)){
    if(o === c || o.x === undefined) continue;
    const ox = c.x-o.x, oy = (c.y-o.y)*0.55;
    const dd = Math.hypot(ox, oy);
    if(dd < 0.20 && dd > 0.0001){
      const push = 0.00085*(1-dd/0.20);
      c.vx += (ox/dd)*push;
      c.vy += (oy/dd)*push;
    }
  }

  c.vx *= 0.94; c.vy *= 0.94;
  c.x += c.vx; c.y += c.vy + Math.sin(c.phase)*0.00035;

  // corrupted daemons twitch
  if(corrupt > 0.35){ c.x += (Math.random()-0.5)*0.0016*corrupt; }

  if(c.x < 0.05){ c.x = 0.05; c.vx = Math.abs(c.vx); }
  if(c.x > 0.95){ c.x = 0.95; c.vx = -Math.abs(c.vx); }
  if(c.y < 0.10){ c.y = 0.10; c.vy = Math.abs(c.vy); }
  if(c.y > 0.90){ c.y = 0.90; c.vy = -Math.abs(c.vy); }
  c.facing = c.vx >= 0 ? 1 : -1;
}

function tankDraw(ctx, c, W, H){
  const d = c.d, care = d.care || {};
  const col = d.color || EL_COLORS[d.element] || '#8B7CF6';
  const size = (STAGE_SIZE[d.stage] || 14) * (0.85 + 0.06*(d.rarity||1));
  const x = c.x*W, y = c.y*H;
  const hunger = (care.hunger ?? 100)/100;
  const energy = (care.energy ?? 100)/100;
  const corrupt = (care.corruption ?? 0)/100;
  const alpha = 0.72 + 0.28*Math.max(0.3, (hunger+energy)/2);

  ctx.save();
  ctx.translate(x,y);
  ctx.scale(c.facing, 1);
  ctx.globalAlpha = alpha;

  // rare daemons carry a halo
  const rank = d.ascensions || 0;
  if(rank > 0){
    const gr = ctx.createRadialGradient(0,0,size*0.5,0,0,size*(2.4+0.25*rank));
    gr.addColorStop(0, '#E8C84D'+Math.min(90, 30+rank*12).toString(16));
    gr.addColorStop(1, '#E8C84D00');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(0,0,size*(2.4+0.25*rank),0,Math.PI*2); ctx.fill();
  }
  if((d.rarity||1) >= 3){
    const g = ctx.createRadialGradient(0,0,size*0.4,0,0,size*2.1);
    g.addColorStop(0, col+'44'); g.addColorStop(1, col+'00');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,size*2.1,0,Math.PI*2); ctx.fill();
  }

  // tail: a sine ribbon trailing behind
  ctx.beginPath();
  ctx.moveTo(-size*0.5, 0);
  for(let i=1;i<=6;i++){
    const t = i/6;
    ctx.lineTo(-size*0.5 - t*size*1.15,
               Math.sin(c.phase - t*2.4)*size*0.42*t);
  }
  ctx.strokeStyle = col; ctx.globalAlpha = alpha*0.5;
  ctx.lineWidth = Math.max(1.5, size*0.16); ctx.lineCap='round';
  ctx.stroke();
  ctx.globalAlpha = alpha;

  // fins scale with rarity
  const fins = Math.min(4, 1 + Math.floor((d.rarity||1)/2));
  for(let i=0;i<fins;i++){
    const a = -0.5 + i*(1.0/Math.max(1,fins-1||1));
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-size*0.7, a*size*1.5, -size*0.15, a*size*1.15);
    ctx.fillStyle = col+'55'; ctx.fill();
  }

  // body
  ctx.beginPath();
  ctx.ellipse(0, 0, size*0.95, size*0.62, Math.sin(c.phase)*0.10, 0, Math.PI*2);
  ctx.fillStyle = col; ctx.globalAlpha = alpha*0.85; ctx.fill();
  ctx.globalAlpha = alpha;
  ctx.lineWidth = 1.2; ctx.strokeStyle = col; ctx.stroke();

  // eye — sleepy when exhausted
  const open = (c.mood === 'sleeping') ? 0.06 : (energy > 0.18 ? 1 : 0.35);
  ctx.beginPath();
  ctx.ellipse(size*0.42, -size*0.12, size*0.15, size*0.15*open, 0, 0, Math.PI*2);
  ctx.fillStyle = '#0b1120'; ctx.fill();

  // a poked daemon flares briefly — the whole point of poking
  if(c.poked > 0){
    ctx.globalAlpha = Math.min(0.5, c.poked / 30);
    ctx.beginPath(); ctx.arc(0, 0, size * 1.5, 0, Math.PI*2);
    ctx.fillStyle = '#FFFFFF'; ctx.fill();
    ctx.globalAlpha = alpha;
  }
  // umbra static
  if(corrupt > 0.35){
    ctx.globalAlpha = alpha*corrupt*0.8;
    for(let i=0;i<3;i++){
      ctx.beginPath();
      ctx.arc((Math.random()-0.5)*size*2, (Math.random()-0.5)*size*1.4,
              Math.random()*1.6, 0, Math.PI*2);
      ctx.fillStyle = '#8B7CF6'; ctx.fill();
    }
  }
  ctx.restore();

  // name, and a quiet word when something's wrong
  ctx.globalAlpha = 0.62;
  ctx.font = '10px ui-monospace, monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#8494ad';
  const lab = y + size*0.62 + 13 + ((d.id*7)%3)*4;
  ctx.fillText(d.name, x, lab);
  if(c.mood === 'sleeping'){
    ctx.globalAlpha = 0.5; ctx.fillStyle = '#7FCBEB';
    ctx.font = '11px ui-monospace, monospace';
    ctx.fillText('z z z', x + size*0.9, y - size*0.7);
    ctx.globalAlpha = 0.62; ctx.font = '10px ui-monospace, monospace';
    ctx.fillStyle = '#8494ad';
  }
  const need = (care.hunger ?? 100) < 25 ? 'hungry'
             : (care.energy ?? 100) < 20 ? 'tired'
             : (care.corruption ?? 0) > 55 ? 'corrupted'
             : (care.happiness ?? 100) < 25 ? 'lonely' : null;
  if(need){
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = need==='corrupted' ? '#8B7CF6' : '#E8C84D';
    ctx.fillText(need, x, lab + 11);
  }
  ctx.globalAlpha = 1;
}

/* -- danger zone: wipe the save and start over -- */
function confirmReset(){
  modal(`<div class="card reset-modal" style="padding:22px;max-width:500px">
    <h2 style="font-size:19px;margin-bottom:6px;color:var(--danger)">Reset</h2>
    <div class="muted" style="font-size:12.5px;margin-bottom:14px">Choose how much to undo. None of this can be reversed.</div>

    <label class="rscope"><input type="radio" name="rscope" value="rifts">
      <span><b>Re-roll the rifts</b><br><span class="muted">Fresh worlds at layer 0. Keeps your daemons, Bastion, and resources. Use this when you want new nodes without losing your roster.</span></span></label>

    <label class="rscope"><input type="radio" name="rscope" value="progress" checked>
      <span><b>Reset progression</b><br><span class="muted">Deletes every daemon, all depth, resources, facilities and the Pulse. Keeps the rifts you've already resolved so you needn't re-sweep.</span></span></label>

    <label class="rscope"><input type="radio" name="rscope" value="everything">
      <span><b>Wipe the instance</b><br><span class="muted">Everything above, plus the discovered rifts and your Array level. Exactly like first boot.</span></span></label>

    <div class="mono muted" style="font-size:11px;margin-top:12px">Type RESET to confirm:</div>
    <input id="reset-word" placeholder="RESET" autocomplete="off" spellcheck="false">
    <div style="display:flex;gap:9px">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn" style="border-color:var(--danger);color:var(--danger)" id="do-reset">Confirm</button>
    </div></div>`);
  $('#reset-word').focus();
  $('#do-reset').onclick=async()=>{
    if($('#reset-word').value.trim()!=='RESET'){toast('Type RESET to confirm');return;}
    const scope=(document.querySelector('input[name="rscope"]:checked')||{}).value||'progress';
    const res=await api('/api/reset',{method:'POST',body:JSON.stringify({confirm:'RESET',scope})});
    closeModal();
    if(res.error){toast(res.message||res.error);return;}
    toast(scope==='rifts'?'Rifts re-rolled':scope==='everything'?'Instance wiped':'Progression reset');
    state.party=[]; state.currentRift=null;
    if(scope!=='rifts') state.devices=(scope==='everything')?[]:state.devices;
    await boot();
  };
}

/* -- jump to whatever a daemon is currently doing -- */
async function jumpToActivity(id){
  const d=(state.roster||[]).find(x=>x.id===id);
  if(!d){toast('Daemon not found');return;}
  if(d.on_expedition) return openRift(d.expedition.mac);
  if(d.harvesting)    return openRift(d.harvesting.mac, d.harvesting.node_index);
  if(d.training)      return openBastion(d.training.hall);
  toast(`${d.name} is resting in the Nest`);
}

async function openRift(mac, nodeIndex){
  let dev=(state.devices||[]).find(x=>x.mac===mac);
  if(!dev){                                   // came straight to the Nest; no scan yet
    try{ const known=await api('/api/devices'); state.devices=known.devices||[]; }catch(e){}
    dev=(state.devices||[]).find(x=>x.mac===mac) || {mac, hostname:''};
  }
  state.view='scan';
  await riftView(dev);
  if(nodeIndex!=null) flashTo(`[data-shelf="${nodeIndex}"]`);
}

async function openBastion(hall){
  state.view='bastion'; setActive('bastion');
  await bastionView();
  flashTo(`[data-fac="${hall}"]`);
}

function flashTo(selector){
  const el=$('#main').querySelector(selector);
  if(!el)return;
  el.scrollIntoView({behavior:'smooth', block:'center'});
  el.classList.add('flash');
  setTimeout(()=>el.classList.remove('flash'), 2200);
}

function daemonCard(d){
  const away=d.on_expedition, mining=!!d.harvesting, inHall=!!d.training;
  const evo = d.can_evolve&&!away?`<button class="btn primary" data-act="evolve" data-id="${d.id}">Evolve → next stage</button>`:'';
  const asc = d.can_ascend&&!away?`<button class="btn" style="border-color:var(--warn);color:var(--warn)" data-ascend="${d.id}">Ascend ✦ rank ${d.ascensions+1}</button>`:'';
  return `<div class="card daemon ${away?'is-away':''}" data-card="${d.id}">
    <div class="head">
      <div class="sig">${daemonSigil(d)}</div>
      <div class="title">
        <h3>${d.name}${d.ascensions?`<span class="asc-rank" title="Ascension rank ${d.ascensions}">${'✦'.repeat(Math.min(d.ascensions,5))}${d.ascensions>5?d.ascensions:''}</span>`:''} ${away?`<span class="away jump" onclick="jumpToActivity(${d.id})" title="Go to ${d.expedition.world}">AWAY · ${d.expedition.world} ↗</span>`:''}${mining?`<span class="away jump" style="color:var(--online);border-color:var(--online)" onclick="jumpToActivity(${d.id})" title="Go to its harvest node">HARVESTING · ${d.harvesting.world} ↗</span>`:''}${inHall?`<span class="away jump" style="color:var(--warn);border-color:var(--warn)" onclick="jumpToActivity(${d.id})" title="Go to ${d.training.hall_name}">TRAINING · ${d.training.hall_name} (+${d.training.gained} ${d.training.stat.toUpperCase()}) ↗</span>`:''}</h3>
        <div class="lvl">${d.stage} · Lv${d.level} · <span class="attr-${d.attribute}">${d.attribute}</span> · <span style="color:${d.color}">${d.element}</span> <span class="stars">${'★'.repeat(d.rarity)}</span></div>
        <div class="xpbar" style="margin-top:7px"><i style="width:${Math.round(100*d.xp/d.xp_to_next)}%"></i></div>
        <div class="mono muted" style="font-size:10.5px;margin-top:3px">${d.xp}/${d.xp_to_next} XP · ${d.wins}W ${d.losses}L</div>
      </div>
    </div>
    <div class="statline">
      <span>HP <b>${d.battle_stats.hp}</b></span><span>ATK <b>${d.battle_stats.atk}</b></span>
      <span>DEF <b>${d.battle_stats.def}</b></span><span>SPD <b>${d.battle_stats.spd}</b></span>
      <span class="muted">pw ${d.power}</span>
    </div>
    <div>
      ${meter('Hunger',d.care.hunger,'hunger')}${meter('Energy',d.care.energy,'energy')}
      ${meter('Happy',d.care.happiness,'happiness')}${meter('Discip.',d.care.discipline,'discipline')}
      ${meter('Corrupt',d.care.corruption,'corruption')}${meter('Weight',d.care.weight,'weight')}
    </div>
    <div class="actions">
      <button class="btn" data-act="feed" data-id="${d.id}">Feed</button>
      <button class="btn" data-act="rest" data-id="${d.id}">Rest</button>
      <button class="btn" data-act="play" data-id="${d.id}">Play</button>
      <button class="btn" data-act="cleanse" data-id="${d.id}">Cleanse</button>
      <button class="btn ghost" data-sell="${d.id}" title="Release for resources">Sell</button>
    </div>
    ${inHall?`<div class="muted" style="font-size:11.5px;font-family:var(--mono)">manual training paused — ${d.training.hall_name} is handling it (+${d.training.rate}/h)</div>`:`<div class="actions">
      <span class="muted" style="font-size:12px;align-self:center">Train:</span>
      <button class="btn ghost" data-train="hp" data-id="${d.id}">+HP</button>
      <button class="btn ghost" data-train="atk" data-id="${d.id}">+ATK</button>
      <button class="btn ghost" data-train="def" data-id="${d.id}">+DEF</button>
      <button class="btn ghost" data-train="spd" data-id="${d.id}">+SPD</button>
    </div>`}
    ${(d.traits&&d.traits.length)?`<div class="worn">${d.traits.map(t=>`<span class="trait" title="${t.desc}">${t.name}</span>`).join('')}</div>`:''}
    ${(d.equipped&&d.equipped.length)?`<div class="worn">${d.equipped.map(x=>`<span class="wglyph" title="${x.kind} Q${x.quality}">${x.kind} Q${x.quality}</span>`).join('')}<span class="mono muted" style="font-size:10px">${d.equipped.length}/${d.glyph_slots} slots</span></div>`:''}
    ${(evo||asc)?`<div class="actions">${evo}${asc}</div>`:''}
  </div>`;
}
function bindDaemonActions(){
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.id,act=b.dataset.act;
    if(act==='evolve'){const r=await api(`/api/daemon/${id}/evolve`,{method:'POST'});if(r.result.ok)toast(`Evolved to ${r.result.to}!`+(r.result.attr_from!==r.result.attr_to?` (now ${r.result.attr_to})`:''));updateCard(r.daemon);return;}
    const r=await api(`/api/daemon/${id}/care`,{method:'POST',body:JSON.stringify({action:act})});
    updateCard(r.daemon);
  });
  document.querySelectorAll('[data-ascend]').forEach(b=>b.onclick=()=>{
    const d=state.roster.find(x=>x.id===+b.dataset.ascend);
    if(d)confirmAscend(d);
  });
  document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{
    const d=state.roster.find(x=>x.id===+b.dataset.sell);
    if(d)confirmSell(d);
  });
  document.querySelectorAll('[data-train]').forEach(b=>b.onclick=async()=>{
    const r=await api(`/api/daemon/${b.dataset.id}/train`,{method:'POST',body:JSON.stringify({stat:b.dataset.train})});
    if(!r.result.ok){toast(r.result.reason==='too_tired'?'Too tired to train — let it rest':'Cannot train');return;}
    toast(`+${r.result.gain} ${b.dataset.train.toUpperCase()}`);updateCard(r.daemon);
  });
}
function updateCard(d){
  const i=state.roster.findIndex(x=>x.id===d.id);if(i>=0)state.roster[i]=d;
  const el=document.querySelector(`[data-card="${d.id}"]`);
  if(el){const tmp=document.createElement('div');tmp.innerHTML=daemonCard(d);el.replaceWith(tmp.firstElementChild);bindDaemonActions();}
}

/* ---------- helpers ---------- */
async function refreshRoster(){const r=await api('/api/nest');state.roster=r.daemons;}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2400);}
function modal(html){$('#modal-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">${html}</div>`;}
function closeModal(){
  $('#modal-root').innerHTML='';
  // closing a battle result, a sale, or any dialog is the moment the world
  // behind it is out of date — pull the change through immediately
  refreshNow();
}
// a kiosk can boot straight into the dashboard: open /#dash
if(location.hash === '#dash'){ boot().then(()=>toggleDash()); } else { boot(); }
